<!DOCTYPE html>
<html>
<head>
	<title>Tables - DIV TABLE</title>
</head>
<body>

<style>
.div-table {
	display: table;
	width: 100%;
}
.div-table-row {
	display: table-row;
}
.div-table-row.header {
	font-weight: bold;
	background-color: #eeeeee;
}
.div-table-col {
	display: table-cell;
	padding: 10px;
	border: 1px Solid Black;
	text-align: left;
}
</style>

<div class="div-table">
	<div class="div-table-row header">
		<div class="div-table-col">
		Name
		</div>
		<div class="div-table-col">
		Role
		</div>
		<div class="div-table-col">
		Location
		</div>
	</div>
	<div class="div-table-row">
		<div class="div-table-col">
		Jane Doe
		</div>
		<div class="div-table-col">
		Programmer
		</div>
		<div class="div-table-col">
		Montreal
		</div>
	</div>
	<div class="div-table-row">
		<div class="div-table-col">
		John Smith
		</div>
		<div class="div-table-col">
		Designer
		</div>
		<div class="div-table-col">
		Toronto
		</div>
	</div>
</div>

</body>
</html>
