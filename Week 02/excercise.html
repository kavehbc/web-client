<!DOCTYPE html>
<html>
<head>
	<title>Sample Table</title>
</head>
<body>
	<table border="1" width="500px" align="center">
		<tr>
			<td colspan="4" align="center">Hello World!</td>
		</tr>
		<tr>
			<td width="25%">1</td>
			<td width="25%" align="right">2</td>
			<td width="50%" colspan="2">3</td>
		</tr>
		<tr>
			<td colspan="2">4</td>
			<td colspan="2" rowspan="2" align="center" valign="top">
				5
				<table border="1" width="100%">
					<tr><td>A</td><td>B</td><td>C</td><td>D</td></tr>
					<tr><td>E</td><td>F</td><td>G</td><td>H</td></tr>
					<tr><td>I</td><td>J</td><td>K</td><td>L</td></tr>
					<tr><td>M</td><td>N</td><td>O</td><td>P</td></tr>
				</table>
			
			</td>
		</tr>
		<tr>
			<td colspan="2">6</td>
		</tr>
		<tr>
			<td colspan="2" align="center">7</td>
			<td width="25%">8</td>
			<td width="25%">9</td>
		</tr>
	</table>
</body>
</html>
