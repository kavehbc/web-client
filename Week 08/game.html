<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2933;
            --muted: #616e7c;
            --accent: #3b5bdb;
            --accent-hover: #2f4ac0;
            --border: #d9dee7;
            --low: #1c7ed6;
            --high: #e8590c;
            --win: #2b8a3e;
            --error: #c92a2a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.8rem;
            text-align: center;
        }

        .intro {
            color: var(--muted);
            margin-bottom: 24px;
        }

        .intro p {
            margin: 6px 0;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 1.15rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        input[type="number"] {
            flex: 1 1 160px;
            min-width: 0;
            padding: 10px 12px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        input[type="number"]:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        button {
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        button:disabled,
        input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        button.secondary:hover {
            background: rgba(59, 91, 219, 0.08);
        }

        .error {
            color: var(--error);
            min-height: 1.5em;
            margin: 8px 0 0;
            font-size: 0.95rem;
        }

        .hidden {
            display: none;
        }

        #feedback {
            font-size: 1.15rem;
            font-weight: 700;
            min-height: 1.6em;
            margin: 14px 0 4px;
        }

        #feedback.low { color: var(--low); }
        #feedback.high { color: var(--high); }
        #feedback.win { color: var(--win); }

        .stats {
            color: var(--muted);
            margin: 4px 0 12px;
        }

        #history {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0;
            margin: 0 0 12px;
            list-style: none;
        }

        #history li {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
        }

        #history li.low { background: var(--low); }
        #history li.high { background: var(--high); }
        #history li.win { background: var(--win); }
    </style>
</head>
<body>
<main>
    <h1>Number Guessing Game</h1>

    <div class="intro">
        <p>Choose a maximum number. The computer picks a random number between 1 and that maximum,
            and you try to guess it.</p>
        <p>If you guess it, you win! Otherwise, the computer tells you whether the number is higher or lower.</p>
    </div>

    <!-- Setup -->
    <form id="setup-form" class="card" novalidate>
        <label for="max-threshold">Enter maximum threshold:</label>
        <div class="row">
            <input type="number" id="max-threshold" min="2" step="1" value="100" required>
            <button type="submit" id="start-game">Start Game</button>
        </div>
        <p id="setup-error" class="error" aria-live="polite"></p>
    </form>

    <!-- Game -->
    <section id="guess-section" class="card hidden">
        <h2>Guess the number between 1 and <span id="threshold-value"></span></h2>

        <form id="guess-form" novalidate>
            <div class="row">
                <input type="number" id="player-guess" min="1" step="1" aria-label="Your guess" required>
                <button type="submit" id="submit-guess">Submit Guess</button>
            </div>
            <p id="guess-error" class="error" aria-live="polite"></p>
        </form>

        <p id="feedback" aria-live="polite"></p>
        <p class="stats">Attempts: <strong id="attempts">0</strong></p>
        <ul id="history" aria-label="Previous guesses"></ul>

        <button type="button" id="play-again" class="secondary hidden">Play Again</button>
    </section>
</main>

<script>
    let randomNumber;
    let maxThreshold;
    let attempts = 0;
    let guessed = [];
    let gameOver = false;

    const setupForm = document.getElementById('setup-form');
    const thresholdInput = document.getElementById('max-threshold');
    const setupError = document.getElementById('setup-error');

    const guessSection = document.getElementById('guess-section');
    const thresholdValue = document.getElementById('threshold-value');
    const guessForm = document.getElementById('guess-form');
    const guessInput = document.getElementById('player-guess');
    const submitButton = document.getElementById('submit-guess');
    const guessError = document.getElementById('guess-error');
    const feedback = document.getElementById('feedback');
    const attemptsEl = document.getElementById('attempts');
    const historyEl = document.getElementById('history');
    const playAgainButton = document.getElementById('play-again');

    // Reads an input as a whole number; returns NaN for empty, decimal or non-numeric values.
    function readInteger(input) {
        const text = input.value.trim();
        if (text === '') return NaN;
        const value = Number(text);
        return Number.isInteger(value) ? value : NaN;
    }

    function startGame(event) {
        event.preventDefault();
        setupError.textContent = '';

        const value = readInteger(thresholdInput);
        if (isNaN(value) || value < 2) {
            setupError.textContent = 'Please enter a whole number of 2 or more.';
            thresholdInput.focus();
            return;
        }

        maxThreshold = value;
        randomNumber = Math.floor(Math.random() * maxThreshold) + 1;
        attempts = 0;
        guessed = [];
        gameOver = false;

        thresholdValue.textContent = maxThreshold;
        guessInput.max = maxThreshold;
        guessInput.value = '';
        guessInput.disabled = false;
        submitButton.disabled = false;
        guessError.textContent = '';
        feedback.textContent = '';
        feedback.className = '';
        attemptsEl.textContent = attempts;
        historyEl.innerHTML = '';
        playAgainButton.classList.add('hidden');

        guessSection.classList.remove('hidden');
        guessInput.focus();
    }

    function addToHistory(guess, result) {
        const item = document.createElement('li');
        item.textContent = guess;
        item.className = result;
        item.title = result === 'low' ? 'Too low' : result === 'high' ? 'Too high' : 'Correct';
        historyEl.appendChild(item);
    }

    function submitGuess(event) {
        event.preventDefault();
        if (gameOver) return;
        guessError.textContent = '';

        const playerGuess = readInteger(guessInput);
        if (isNaN(playerGuess) || playerGuess < 1 || playerGuess > maxThreshold) {
            guessError.textContent = `Please enter a whole number between 1 and ${maxThreshold}.`;
            guessInput.select();
            return;
        }

        if (guessed.includes(playerGuess)) {
            guessError.textContent = `You already guessed ${playerGuess}. Try a different number.`;
            guessInput.select();
            return;
        }

        guessed.push(playerGuess);
        attempts++;
        attemptsEl.textContent = attempts;

        if (playerGuess === randomNumber) {
            const word = attempts === 1 ? 'attempt' : 'attempts';
            feedback.textContent = `Congratulations! ${randomNumber} is correct. You got it in ${attempts} ${word}!`;
            feedback.className = 'win';
            addToHistory(playerGuess, 'win');
            endGame();
            return;
        }

        if (playerGuess < randomNumber) {
            feedback.textContent = `${playerGuess} is too low! Try a higher number.`;
            feedback.className = 'low';
            addToHistory(playerGuess, 'low');
        } else {
            feedback.textContent = `${playerGuess} is too high! Try a lower number.`;
            feedback.className = 'high';
            addToHistory(playerGuess, 'high');
        }

        guessInput.value = '';
        guessInput.focus();
    }

    function endGame() {
        gameOver = true;
        guessInput.disabled = true;
        submitButton.disabled = true;
        playAgainButton.classList.remove('hidden');
        playAgainButton.focus();
    }

    function playAgain() {
        guessSection.classList.add('hidden');
        thresholdInput.focus();
        thresholdInput.select();
    }

    setupForm.addEventListener('submit', startGame);
    guessForm.addEventListener('submit', submitGuess);
    playAgainButton.addEventListener('click', playAgain);
</script>
</body>
</html>
